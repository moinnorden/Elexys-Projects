<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>

  <style>

    body{
      margin:0;
      padding:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
      font-family:Arial;
    }

    .login-box{
      background:white;
      padding:40px;
      border-radius:10px;
      box-shadow:0 0 15px rgba(0,0,0,0.2);
      text-align:center;
    }

    button{
      padding:12px 25px;
      font-size:16px;
      border:none;
      border-radius:5px;
      cursor:pointer;
      background:#4285F4;
      color:white;
    }

    h2{
      margin-bottom:20px;
    }

  </style>

</head>

<body>

  <div class="login-box">

    <h2>Admin Login</h2>

    <button onclick="login()">
      Login with Google
    </button>

  </div>





<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyC97I-QSoDqSLfUR3Vt6gYSM5VrXAJb2G4",
  authDomain: "elexys-technologies.firebaseapp.com",
  projectId: "elexys-technologies",
  storageBucket: "elexys-technologies.firebasestorage.app",
  messagingSenderId: "1002855081911",
  appId: "1:1002855081911:web:6bafab1a4fea559ff9ea32"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

window.login = function () {

  signInWithPopup(auth, provider)

  .then((result) => {

    const user = result.user;

    if(user.email === "YOUR_GMAIL@gmail.com"){

      alert("Login Successful");

      window.location.href = "admin.html";

    }
    else{

      alert("Access Denied");

    }

  })

  .catch((error) => {

    alert(error.message);

  });

}

</script>

</body>
</html>
