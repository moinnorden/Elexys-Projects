<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Elexys Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googles.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      font-family:'Poppins', sans-serif;

      background:
      linear-gradient(
      135deg,
      #0f172a,
      #111827,
      #1e293b
      );

      overflow:hidden;

      position:relative;
    }

    body::before{

      content:"";

      position:absolute;

      width:500px;
      height:500px;

      background:#38bdf8;

      border-radius:50%;

      top:-200px;
      left:-150px;

      opacity:0.08;

      filter:blur(40px);

    }

    body::after{

      content:"";

      position:absolute;

      width:400px;
      height:400px;

      background:#14b8a6;

      border-radius:50%;

      bottom:-180px;
      right:-120px;

      opacity:0.08;

      filter:blur(40px);

    }

    .login-box{

      width:380px;

      padding:45px 35px;

      border-radius:25px;

      background:
      rgba(255,255,255,0.08);

      backdrop-filter:blur(18px);

      border:
      1px solid rgba(255,255,255,0.12);

      box-shadow:
      0 10px 40px rgba(0,0,0,0.35);

      text-align:center;

      position:relative;

      z-index:1;

      animation:fadeIn 1s ease;
    }

    @keyframes fadeIn{

      from{
        opacity:0;
        transform:translateY(30px);
      }

      to{
        opacity:1;
        transform:translateY(0px);
      }

    }

    .logo{

      width:90px;
      height:90px;

      margin:auto;
      margin-bottom:20px;

      border-radius:50%;

      background:
      linear-gradient(
      135deg,
      #06b6d4,
      #14b8a6
      );

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:36px;
      color:white;

      box-shadow:
      0 0 25px rgba(20,184,166,0.4);

    }

    h1{

      color:white;

      font-size:28px;

      margin-bottom:8px;

      font-weight:600;

    }

    .subtitle{

      color:#cbd5e1;

      font-size:14px;

      margin-bottom:35px;

      line-height:24px;

    }

    .google-btn{

      width:100%;

      padding:15px;

      border:none;

      border-radius:14px;

      background:
      linear-gradient(
      135deg,
      #2563eb,
      #06b6d4
      );

      color:white;

      font-size:16px;

      font-weight:600;

      cursor:pointer;

      transition:0.3s;

      box-shadow:
      0 8px 20px rgba(37,99,235,0.35);

    }

    .google-btn:hover{

      transform:translateY(-3px);

      box-shadow:
      0 12px 30px rgba(37,99,235,0.45);

    }

    .google-btn:active{

      transform:scale(0.98);

    }

    .footer-text{

      margin-top:25px;

      color:#94a3b8;

      font-size:12px;

      line-height:22px;

    }

    .status{

      margin-top:18px;

      color:#22c55e;

      font-size:13px;

    }

  </style>

</head>

<body>

  <div class="login-box">

    <div class="logo">
      ⚡
    </div>

    <h1>
      Elexys Admin
    </h1>

    <p class="subtitle">
      Secure Firebase Authentication Panel<br>
      Advanced Management Access
    </p>

    <button class="google-btn" onclick="login()">
      Continue with Google
    </button>

    <div class="status">
      ● Firebase Secure Connection Active
    </div>

    <p class="footer-text">
      Elexys Technologies © 2026<br>
      Embedded • IoT • Automation
    </p>

  </div>





<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {

  getAuth,
  GoogleAuthProvider,
  signInWithPopup

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {

  apiKey: "AIzaSyC97I-QSoDqSLfUR3Vt6gYSM5VrXAJb2G4",

  authDomain:
  "elexys-technologies.firebaseapp.com",

  projectId:
  "elexys-technologies",

  storageBucket:
  "elexys-technologies.appspot.com",

  messagingSenderId:
  "1002855081911",

  appId:
  "1:1002855081911:web:6bafab1a4fea559ff9ea32"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const provider = new GoogleAuthProvider();

window.login = function () {

  signInWithPopup(auth, provider)

  .then((result) => {

    const user = result.user;

    const admins = [

      "moinyunus@gmail.com"

    ];

    if(admins.includes(user.email)){

      alert(
      "Welcome Admin: " + user.email
      );

      window.location.href =
      "admin.html";

    }

    else{

      alert(
      "Access Denied"
      );

    }

  })

  .catch((error) => {

    alert(error.message);

  });

}

</script>

</body>
</html>
