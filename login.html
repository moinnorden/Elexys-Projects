<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Elexys Technologies — Login / Register</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#04061a;
  --card:#0a0f2e;
  --border:rgba(100,80,200,.25);
  --purple:#7c3ce8;
  --purple2:#9b5cf6;
  --blue:#2563eb;
  --cyan:#22d3ee;
  --white:#ffffff;
  --txt:#c8d4f0;
  --muted:#6878a8;
  --grad:linear-gradient(135deg,#7c3ce8 0%,#3b82f6 100%);
  --wa:#25d366;
}
body{
  min-height:100vh;background:var(--bg);
  font-family:'Exo 2',sans-serif;color:var(--txt);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(120,60,220,.15) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(37,99,235,.12) 0%,transparent 50%);
}

/* Back link */
.back-link{
  position:fixed;top:20px;left:20px;
  color:var(--muted);text-decoration:none;font-size:.85rem;
  display:flex;align-items:center;gap:6px;
  transition:color .2s;
}
.back-link:hover{color:var(--purple2)}

/* Logo */
.logo{
  text-align:center;margin-bottom:28px;
}
.logo-text{
  font-family:'Orbitron',sans-serif;font-size:1.6rem;font-weight:900;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.logo-sub{font-size:.7rem;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;margin-top:4px}

/* Card */
.card{
  width:100%;max-width:440px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:36px 32px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);
}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:28px;border-radius:10px;overflow:hidden;border:1px solid var(--border)}
.tab{
  flex:1;padding:11px;text-align:center;cursor:pointer;
  font-size:.88rem;font-weight:600;letter-spacing:.04em;
  background:transparent;color:var(--muted);border:none;
  transition:all .2s;font-family:'Exo 2',sans-serif;
}
.tab.active{background:var(--grad);color:#fff}

/* Form */
.form{display:none}
.form.active{display:block}

.fg{margin-bottom:16px}
.fg label{
  display:block;font-size:.72rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;
  color:var(--purple2);margin-bottom:6px;
}
.fg input,.fg select{
  width:100%;padding:11px 14px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);border-radius:10px;
  color:var(--white);font-family:'Exo 2',sans-serif;font-size:.9rem;
  outline:none;transition:border-color .2s,box-shadow .2s;
  appearance:none;
}
.fg input::placeholder{color:var(--muted)}
.fg input:focus,.fg select:focus{
  border-color:var(--purple2);
  box-shadow:0 0 0 3px rgba(124,92,246,.15);
}
.fg select option{background:#0a0f2e;color:var(--txt)}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:400px){.row2{grid-template-columns:1fr}}

/* Button */
.btn{
  width:100%;padding:13px;margin-top:8px;
  background:var(--grad);border:none;border-radius:10px;
  color:#fff;font-family:'Exo 2',sans-serif;
  font-size:.95rem;font-weight:700;letter-spacing:.06em;
  cursor:pointer;transition:opacity .2s,transform .2s;
}
.btn:hover{opacity:.88;transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* Divider */
.divider{
  text-align:center;margin:18px 0;font-size:.75rem;color:var(--muted);
  position:relative;
}
.divider::before,.divider::after{
  content:'';position:absolute;top:50%;width:38%;height:1px;
  background:var(--border);
}
.divider::before{left:0}.divider::after{right:0}

/* Google btn */
.btn-google{
  width:100%;padding:11px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);border-radius:10px;
  color:var(--txt);font-family:'Exo 2',sans-serif;
  font-size:.9rem;font-weight:500;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:10px;
  transition:background .2s,border-color .2s;
}
.btn-google:hover{background:rgba(255,255,255,.1);border-color:rgba(100,80,200,.5)}

/* Message */
.msg{
  padding:10px 14px;border-radius:8px;font-size:.82rem;
  margin-bottom:14px;display:none;
}
.msg.success{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);color:#6ee7b7}
.msg.error{background:rgba(244,63,94,.12);border:1px solid rgba(244,63,94,.3);color:#fda4af}

/* Switch text */
.switch-txt{text-align:center;font-size:.8rem;color:var(--muted);margin-top:16px}
.switch-txt span{color:var(--purple2);cursor:pointer;font-weight:600}
.switch-txt span:hover{text-decoration:underline}

/* Forgot */
.forgot{text-align:right;font-size:.75rem;margin-top:-8px;margin-bottom:14px}
.forgot span{color:var(--purple2);cursor:pointer}
.forgot span:hover{text-decoration:underline}

/* Spinner */
.spinner{
  display:inline-block;width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;
}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<a href="index.html" class="back-link">← Back to Website</a>

<div class="card">
  <div class="logo">
    <div class="logo-text">ELEXYS</div>
    <div class="logo-sub">Technologies — Student Portal</div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')">🔑 Login</button>
    <button class="tab" onclick="switchTab('register')">📝 Register</button>
  </div>

  <!-- Message box -->
  <div class="msg" id="msg"></div>

  <!-- LOGIN FORM -->
  <div class="form active" id="loginForm">
    <div class="fg">
      <label>Email Address</label>
      <input type="email" id="lEmail" placeholder="your@email.com"/>
    </div>
    <div class="fg">
      <label>Password</label>
      <input type="password" id="lPass" placeholder="Enter password"/>
    </div>
    <div class="forgot"><span onclick="forgotPassword()">Forgot password?</span></div>
    <button class="btn" id="loginBtn" onclick="doLogin()">🔑 Login to Account</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="switch-txt">Don't have an account? <span onclick="switchTab('register')">Register here</span></div>
  </div>

  <!-- REGISTER FORM -->
  <div class="form" id="registerForm">
    <div class="row2">
      <div class="fg">
        <label>Full Name *</label>
        <input type="text" id="rName" placeholder="Your full name"/>
      </div>
      <div class="fg">
        <label>Phone / WhatsApp *</label>
        <input type="tel" id="rPhone" placeholder="+91 9876543210"/>
      </div>
    </div>
    <div class="fg">
      <label>Email Address *</label>
      <input type="email" id="rEmail" placeholder="your@email.com"/>
    </div>
    <div class="row2">
      <div class="fg">
        <label>College / Institute *</label>
        <input type="text" id="rCollege" placeholder="College name"/>
      </div>
      <div class="fg">
        <label>Branch *</label>
        <select id="rBranch">
          <option value="">Select branch</option>
          <option>Electronics (ECE)</option>
          <option>Electrical (EEE)</option>
          <option>Mechanical</option>
          <option>Computer Science (CSE)</option>
          <option>IT</option>
          <option>Civil</option>
          <option>Instrumentation</option>
          <option>Mechatronics</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="row2">
      <div class="fg">
        <label>Year of Study</label>
        <select id="rYear">
          <option value="">Select year</option>
          <option>1st Year</option>
          <option>2nd Year</option>
          <option>3rd Year</option>
          <option>4th Year</option>
          <option>PG / M.Tech</option>
          <option>PhD</option>
        </select>
      </div>
      <div class="fg">
        <label>City</label>
        <input type="text" id="rCity" placeholder="Your city"/>
      </div>
    </div>
    <div class="fg">
      <label>Password *</label>
      <input type="password" id="rPass" placeholder="Minimum 6 characters"/>
    </div>
    <button class="btn" id="registerBtn" onclick="doRegister()">📝 Create My Account</button>
    <div class="divider">or</div>
    <button class="btn-google" onclick="doGoogleLogin()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continue with Google
    </button>
    <div class="switch-txt">Already have an account? <span onclick="switchTab('login')">Login here</span></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         GoogleAuthProvider, signInWithPopup, updateProfile, sendPasswordResetEmail }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC97I-QSoDqSLfUR3Vt6gYSM5VrXAJb2G4",
  authDomain: "elexys-technologies.firebaseapp.com",
  projectId: "elexys-technologies",
  storageBucket: "elexys-technologies.firebasestorage.app",
  messagingSenderId: "1002855081911",
  appId: "1:1002855081911:web:6bafab1a4fea559ff9ea32"
};

const app  = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db   = getFirestore(app);
const gProvider = new GoogleAuthProvider();

function showMsg(type, text){
  const el = document.getElementById('msg');
  el.className = 'msg ' + type;
  el.textContent = text;
  el.style.display = 'block';
  if(type === 'success') setTimeout(()=>{ el.style.display='none'; }, 4000);
}

// Save student profile to Firestore
async function saveUserProfile(user, extra={}){
  await setDoc(doc(db,'users', user.uid), {
    name:    extra.name  || user.displayName || '',
    email:   user.email,
    phone:   extra.phone   || '',
    college: extra.college || '',
    branch:  extra.branch  || '',
    year:    extra.year    || '',
    city:    extra.city    || '',
    registeredAt: serverTimestamp()
  }, { merge: true });
}

// REGISTER
window.doRegister = async function(){
  const name    = document.getElementById('rName').value.trim();
  const phone   = document.getElementById('rPhone').value.trim();
  const email   = document.getElementById('rEmail').value.trim();
  const college = document.getElementById('rCollege').value.trim();
  const branch  = document.getElementById('rBranch').value;
  const year    = document.getElementById('rYear').value;
  const city    = document.getElementById('rCity').value.trim();
  const pass    = document.getElementById('rPass').value;

  if(!name||!phone||!email||!college||!branch||!pass){
    showMsg('error','⚠️ Please fill in all required fields (*).');
    return;
  }
  if(pass.length < 6){
    showMsg('error','⚠️ Password must be at least 6 characters.');
    return;
  }

  const btn = document.getElementById('registerBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Creating Account…';

  try{
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });
    await saveUserProfile(cred.user, {name,phone,college,branch,year,city});
    showMsg('success','✅ Account created! Redirecting…');
    setTimeout(()=>{ window.location.href='index.html'; }, 1500);
  } catch(e){
    let errMsg = e.message;
    if(e.code === 'auth/email-already-in-use') errMsg = 'This email is already registered. Please login.';
    if(e.code === 'auth/invalid-email') errMsg = 'Please enter a valid email address.';
    showMsg('error', '❌ ' + errMsg);
    btn.disabled = false;
    btn.innerHTML = '📝 Create My Account';
  }
};

// LOGIN
window.doLogin = async function(){
  const email = document.getElementById('lEmail').value.trim();
  const pass  = document.getElementById('lPass').value;
  if(!email||!pass){ showMsg('error','⚠️ Please enter email and password.'); return; }

  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Logging in…';

  try{
    await signInWithEmailAndPassword(auth, email, pass);
    showMsg('success','✅ Login successful! Redirecting…');
    setTimeout(()=>{ window.location.href='index.html'; }, 1200);
  } catch(e){
    let errMsg = e.message;
    if(e.code === 'auth/user-not-found') errMsg = 'No account found with this email.';
    if(e.code === 'auth/wrong-password') errMsg = 'Incorrect password. Please try again.';
    if(e.code === 'auth/invalid-credential') errMsg = 'Invalid email or password.';
    showMsg('error','❌ ' + errMsg);
    btn.disabled = false;
    btn.innerHTML = '🔑 Login to Account';
  }
};

// GOOGLE LOGIN
window.doGoogleLogin = async function(){
  try{
    const result = await signInWithPopup(auth, gProvider);
    await saveUserProfile(result.user);
    showMsg('success','✅ Logged in with Google! Redirecting…');
    setTimeout(()=>{ window.location.href='index.html'; }, 1200);
  } catch(e){
    showMsg('error','❌ Google login failed: ' + e.message);
  }
};

// FORGOT PASSWORD
window.forgotPassword = async function(){
  const email = document.getElementById('lEmail').value.trim();
  if(!email){ showMsg('error','⚠️ Enter your email first, then click Forgot Password.'); return; }
  try{
    await sendPasswordResetEmail(auth, email);
    showMsg('success','📧 Password reset email sent! Check your inbox.');
  } catch(e){
    showMsg('error','❌ ' + e.message);
  }
};
</script>

<script>
function switchTab(tab){
  document.getElementById('msg').style.display='none';
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', (tab==='login'&&i===0)||(tab==='register'&&i===1));
  });
  document.getElementById('loginForm').classList.toggle('active', tab==='login');
  document.getElementById('registerForm').classList.toggle('active', tab==='register');
}
</script>

</body>
</html>
