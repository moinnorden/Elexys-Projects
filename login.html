<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Login — Elexys Technologies</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #0a0a12;
    --bg2: #0f0f1a;
    --card: #13131f;
    --border: #1e1e35;
    --purple: #7c3aed;
    --purple2: #a855f7;
    --purple3: #6d28d9;
    --cyan: #06b6d4;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --error: #f87171;
    --success: #4ade80;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(124,58,237,0.25) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 90% 80%, rgba(6,182,212,0.1) 0%, transparent 60%);
    pointer-events: none;
  }
  .grid-bg {
    position: fixed; inset: 0;
    background-image: linear-gradient(rgba(124,58,237,0.06) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(124,58,237,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Header */
  .site-header {
    position: fixed; top:0; left:0; right:0;
    padding: 16px 32px;
    display: flex; align-items: center; gap: 12px;
    background: rgba(10,10,18,0.8);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    z-index: 100;
  }
  .logo-text { font-family: 'Orbitron', monospace; font-size: 1.2rem; font-weight: 900; color: var(--purple2); letter-spacing: 2px; }
  .logo-sub { font-size: 0.7rem; color: var(--muted); letter-spacing: 3px; text-transform: uppercase; }
  .back-btn {
    margin-left: auto;
    color: var(--muted); font-family: 'Rajdhani', sans-serif; font-size: 0.9rem;
    text-decoration: none; display: flex; align-items: center; gap: 6px;
    transition: color 0.2s;
  }
  .back-btn:hover { color: var(--purple2); }

  /* Card */
  .auth-container {
    position: relative; z-index: 10;
    width: 100%; max-width: 460px;
    padding: 20px;
    margin-top: 70px;
  }
  .auth-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px;
    box-shadow: 0 0 60px rgba(124,58,237,0.15), 0 20px 60px rgba(0,0,0,0.5);
    position: relative; overflow: hidden;
  }
  .auth-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--purple), var(--cyan), var(--purple), transparent);
  }
  .card-glow {
    position: absolute; top: -60px; right: -60px;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(124,58,237,0.12) 0%, transparent 70%);
    pointer-events: none;
  }

  .auth-title {
    font-family: 'Orbitron', monospace;
    font-size: 1.5rem; font-weight: 900;
    color: var(--text); margin-bottom: 6px;
    text-align: center;
  }
  .auth-sub { text-align: center; color: var(--muted); font-size: 0.95rem; margin-bottom: 28px; }

  /* Tabs */
  .tabs { display: flex; gap: 0; margin-bottom: 28px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .tab-btn {
    flex: 1; padding: 11px; background: transparent; border: none; cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 600;
    color: var(--muted); transition: all 0.25s; letter-spacing: 1px;
  }
  .tab-btn.active { background: linear-gradient(135deg, var(--purple3), var(--purple)); color: #fff; }
  .tab-btn:hover:not(.active) { background: rgba(124,58,237,0.1); color: var(--text); }

  /* Forms */
  .form-section { display: none; }
  .form-section.active { display: block; }

  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 0.82rem; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 7px; }
  .form-input {
    width: 100%; padding: 12px 16px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text);
    font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 500;
    transition: all 0.2s; outline: none;
  }
  .form-input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(124,58,237,0.15); background: rgba(124,58,237,0.05); }
  .form-input::placeholder { color: rgba(148,163,184,0.4); }
  select.form-input { cursor: pointer; }
  select.form-input option { background: #1a1a2e; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

  .btn-primary {
    width: 100%; padding: 14px;
    background: linear-gradient(135deg, var(--purple3), var(--purple2));
    border: none; border-radius: 10px; cursor: pointer;
    font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700;
    color: #fff; letter-spacing: 2px; text-transform: uppercase;
    transition: all 0.25s; margin-top: 6px;
    box-shadow: 0 4px 20px rgba(124,58,237,0.35);
    position: relative; overflow: hidden;
  }
  .btn-primary::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
    transform: translateX(-100%); transition: transform 0.4s;
  }
  .btn-primary:hover::after { transform: translateX(100%); }
  .btn-primary:hover { box-shadow: 0 6px 30px rgba(124,58,237,0.55); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

  .divider { display: flex; align-items: center; gap: 14px; margin: 22px 0; }
  .divider-line { flex: 1; height: 1px; background: var(--border); }
  .divider-text { font-size: 0.78rem; color: var(--muted); letter-spacing: 1px; }

  .btn-google {
    width: 100%; padding: 12px; background: rgba(255,255,255,0.04);
    border: 1px solid var(--border); border-radius: 10px; cursor: pointer;
    font-family: 'Rajdhani', sans-serif; font-size: 0.95rem; font-weight: 600;
    color: var(--text); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-google:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); }
  .google-icon { width: 18px; height: 18px; }

  .msg-box {
    padding: 11px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
    margin-bottom: 16px; display: none; align-items: center; gap: 8px;
  }
  .msg-box.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.3); color: var(--error); display: flex; }
  .msg-box.success { background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); display: flex; }

  .strength-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .strength-fill { height: 100%; border-radius: 2px; transition: all 0.3s; width: 0; }

  .forgot-link { text-align: right; margin-top: -10px; margin-bottom: 14px; }
  .forgot-link a { color: var(--purple2); font-size: 0.82rem; text-decoration: none; }
  .forgot-link a:hover { text-decoration: underline; }

  .footer-note { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 18px; }
  .footer-note a { color: var(--purple2); text-decoration: none; }

  /* Logged in state */
  .logged-in-view {
    display: none; text-align: center;
    padding: 20px 0;
  }
  .logged-in-view.show { display: block; }
  .user-avatar {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--purple3), var(--cyan));
    display: flex; align-items: center; justify-content: center;
    font-family: 'Orbitron', monospace; font-size: 1.6rem; font-weight: 900;
    margin: 0 auto 16px;
    box-shadow: 0 0 30px rgba(124,58,237,0.4);
  }
  .user-name { font-family: 'Orbitron', monospace; font-size: 1.1rem; margin-bottom: 4px; color: var(--purple2); }
  .user-email { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .btn-logout {
    padding: 10px 28px; background: transparent;
    border: 1px solid var(--error); border-radius: 8px;
    color: var(--error); cursor: pointer; font-family: 'Rajdhani', sans-serif;
    font-weight: 600; font-size: 0.95rem; transition: all 0.2s;
  }
  .btn-logout:hover { background: rgba(248,113,113,0.1); }

  .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 480px) {
    .auth-card { padding: 28px 20px; }
    .row-2 { grid-template-columns: 1fr; gap: 0; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>

<header class="site-header">
  <div>
    <div class="logo-text">⚡ ELEXYS</div>
    <div class="logo-sub">Technologies</div>
  </div>
  <a href="index.html" class="back-btn">← Back to Home</a>
</header>

<div class="auth-container">
  <div class="auth-card">
    <div class="card-glow"></div>

    <!-- Logged-in view -->
    <div class="logged-in-view" id="loggedInView">
      <div class="user-avatar" id="userInitial">?</div>
      <div class="user-name" id="userName">—</div>
      <div class="user-email" id="userEmail">—</div>
      <p style="color:var(--muted);font-size:0.9rem;margin-bottom:20px;">You are logged in successfully.</p>
      <a href="index.html" style="display:inline-block;padding:11px 28px;background:linear-gradient(135deg,var(--purple3),var(--purple2));border-radius:8px;color:#fff;text-decoration:none;font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;margin-bottom:12px;">Go to Website</a>
      <br/><button class="btn-logout" id="logoutBtn">Logout</button>
    </div>

    <!-- Auth forms -->
    <div id="authForms">
      <h2 class="auth-title">ELEXYS PORTAL</h2>
      <p class="auth-sub">Sign in or create your student account</p>

      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('login')">LOGIN</button>
        <button class="tab-btn" onclick="switchTab('register')">REGISTER</button>
      </div>

      <!-- Login -->
      <div class="form-section active" id="loginSection">
        <div class="msg-box" id="loginMsg"></div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPass" placeholder="••••••••"/>
        </div>
        <div class="forgot-link"><a href="#" onclick="forgotPassword()">Forgot password?</a></div>
        <button class="btn-primary" id="loginBtn" onclick="loginUser()">LOGIN →</button>

        <div class="divider"><div class="divider-line"></div><span class="divider-text">OR</span><div class="divider-line"></div></div>
        <button class="btn-google" onclick="loginGoogle()">
          <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>
      </div>

      <!-- Register -->
      <div class="form-section" id="registerSection">
        <div class="msg-box" id="registerMsg"></div>
        <div class="row-2">
          <div class="form-group">
            <label class="form-label">First Name</label>
            <input type="text" class="form-input" id="regFirst" placeholder="Rahul"/>
          </div>
          <div class="form-group">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-input" id="regLast" placeholder="Sharma"/>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="regEmail" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
          <label class="form-label">WhatsApp Number</label>
          <input type="tel" class="form-input" id="regPhone" placeholder="+91 98765 43210"/>
        </div>
        <div class="row-2">
          <div class="form-group">
            <label class="form-label">Branch</label>
            <select class="form-input" id="regBranch">
              <option value="">Select</option>
              <option>Electrical Engg.</option>
              <option>Electronics Engg.</option>
              <option>Mechatronics</option>
              <option>Instrumentation</option>
              <option>Telecom Engg.</option>
              <option>B.Tech / M.Tech</option>
              <option>Diploma (Electronics)</option>
              <option>Diploma (Electrical)</option>
              <option>BSc / MSc</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">City / State</label>
            <input type="text" class="form-input" id="regCity" placeholder="Nashik, MH"/>
          </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="regPass" placeholder="Min 6 characters" oninput="checkStrength(this.value)"/>
          <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
        </div>
        <button class="btn-primary" id="registerBtn" onclick="registerUser()">CREATE ACCOUNT →</button>

        <div class="divider"><div class="divider-line"></div><span class="divider-text">OR</span><div class="divider-line"></div></div>
        <button class="btn-google" onclick="loginGoogle()">
          <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Register with Google
        </button>
      </div>
    </div>

    <div class="footer-note">
      By continuing, you agree to our <a href="#">Terms of Service</a>.<br/>
      Questions? <a href="https://wa.me/918796168099">WhatsApp us</a>
    </div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC97I-QSoDqSLfUR3Vt6gYSM5VrXAJb2G4",
  authDomain: "elexys-technologies.firebaseapp.com",
  projectId: "elexys-technologies",
  storageBucket: "elexys-technologies.firebasestorage.app",
  messagingSenderId: "1002855081911",
  appId: "1:1002855081911:web:6bafab1a4fea559ff9ea32"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const googleProvider = new GoogleAuthProvider();

// Save user profile to Firestore
async function saveUserProfile(uid, data) {
  await setDoc(doc(db, "customers", uid), { ...data, updatedAt: serverTimestamp() }, { merge: true });
}

// Auth state listener
onAuthStateChanged(auth, (user) => {
  if (user) showLoggedIn(user);
  else showAuthForms();
});

function showLoggedIn(user) {
  document.getElementById('authForms').style.display = 'none';
  const lv = document.getElementById('loggedInView');
  lv.classList.add('show');
  const name = user.displayName || user.email;
  document.getElementById('userName').textContent = name;
  document.getElementById('userEmail').textContent = user.email;
  document.getElementById('userInitial').textContent = (name[0] || '?').toUpperCase();
}

function showAuthForms() {
  document.getElementById('authForms').style.display = 'block';
  document.getElementById('loggedInView').classList.remove('show');
}

// Expose functions to window
window.loginUser = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg-box';
  if (!email || !pass) { showMsg(msg, 'error', '⚠ Please fill all fields.'); return; }
  btn.innerHTML = '<span class="spinner"></span> Logging in...'; btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
  } catch(e) {
    showMsg(msg, 'error', '❌ ' + friendlyError(e.code));
    btn.innerHTML = 'LOGIN →'; btn.disabled = false;
  }
};

window.registerUser = async function() {
  const first = document.getElementById('regFirst').value.trim();
  const last = document.getElementById('regLast').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const phone = document.getElementById('regPhone').value.trim();
  const branch = document.getElementById('regBranch').value;
  const city = document.getElementById('regCity').value.trim();
  const pass = document.getElementById('regPass').value;
  const btn = document.getElementById('registerBtn');
  const msg = document.getElementById('registerMsg');
  msg.className = 'msg-box';
  if (!first || !last || !email || !pass) { showMsg(msg, 'error', '⚠ Please fill all required fields.'); return; }
  if (pass.length < 6) { showMsg(msg, 'error', '⚠ Password must be at least 6 characters.'); return; }
  btn.innerHTML = '<span class="spinner"></span> Creating account...'; btn.disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: first + ' ' + last });
    await saveUserProfile(cred.user.uid, {
      firstName: first, lastName: last, fullName: first + ' ' + last,
      email, phone, branch, city,
      createdAt: serverTimestamp(),
      role: 'customer', orders: []
    });
    showMsg(msg, 'success', '✅ Account created successfully!');
  } catch(e) {
    showMsg(msg, 'error', '❌ ' + friendlyError(e.code));
    btn.innerHTML = 'CREATE ACCOUNT →'; btn.disabled = false;
  }
};

window.loginGoogle = async function() {
  try {
    const result = await signInWithPopup(auth, googleProvider);
    const user = result.user;
    const snap = await getDoc(doc(db, "customers", user.uid));
    if (!snap.exists()) {
      await saveUserProfile(user.uid, {
        fullName: user.displayName || '', email: user.email,
        phone: user.phoneNumber || '', branch: '', city: '',
        createdAt: serverTimestamp(), role: 'customer', orders: []
      });
    }
  } catch(e) {
    console.error(e);
  }
};

window.forgotPassword = async function() {
  const email = document.getElementById('loginEmail').value.trim();
  const msg = document.getElementById('loginMsg');
  if (!email) { showMsg(msg, 'error', '⚠ Enter your email above first.'); return; }
  try {
    await sendPasswordResetEmail(auth, email);
    showMsg(msg, 'success', '✅ Password reset email sent!');
  } catch(e) {
    showMsg(msg, 'error', '❌ ' + friendlyError(e.code));
  }
};

document.getElementById('logoutBtn').addEventListener('click', () => signOut(auth));

function showMsg(el, type, text) {
  el.className = 'msg-box ' + type;
  el.textContent = text;
}

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use': 'Email already registered.',
    'auth/invalid-email': 'Invalid email address.',
    'auth/wrong-password': 'Wrong password.',
    'auth/user-not-found': 'No account found with this email.',
    'auth/weak-password': 'Password too weak (min 6 chars).',
    'auth/too-many-requests': 'Too many attempts. Try later.',
    'auth/invalid-credential': 'Invalid email or password.',
  };
  return map[code] || 'Something went wrong. Try again.';
}

window.switchTab = function(tab) {
  document.querySelectorAll('.tab-btn').forEach((b,i) => b.classList.toggle('active', (i===0 && tab==='login') || (i===1 && tab==='register')));
  document.getElementById('loginSection').classList.toggle('active', tab==='login');
  document.getElementById('registerSection').classList.toggle('active', tab==='register');
};

window.checkStrength = function(v) {
  const fill = document.getElementById('strengthFill');
  let score = 0;
  if (v.length >= 6) score++;
  if (v.length >= 10) score++;
  if (/[A-Z]/.test(v)) score++;
  if (/[0-9]/.test(v)) score++;
  if (/[^A-Za-z0-9]/.test(v)) score++;
  const colors = ['#ef4444','#f97316','#eab308','#22c55e','#06b6d4'];
  fill.style.width = (score * 20) + '%';
  fill.style.background = colors[score-1] || '#ef4444';
};
</script>
</body>
</html>
